[project]
name = "fast-transcriber"
version = "0.1.0"
description = "Local MP3 transcription with FastAPI and faster-whisper"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "faster-whisper>=1.2,<2",
    # faster-whisper 1.2.1 still uses metadata_errors, removed in PyAV 19.
    "av>=11,<19",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
